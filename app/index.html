<style>html,body{margin:0;height:100%;background:#3a0f17}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#w{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,rgba(226,193,113,.25),transparent 40%),linear-gradient(160deg,#7a1f2b,#3a0f17);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;transition:opacity .45s}#w.out{opacity:0;pointer-events:none}.c{background:#fffdf8;border-radius:24px;padding:34px 22px 26px;width:min(380px,100%);box-sizing:border-box;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}.o{position:relative;width:108px;height:108px;margin:0 auto 12px;display:grid;place-items:center;border-radius:50%;box-shadow:0 14px 34px -12px rgba(58,15,23,.75),0 0 0 4px rgba(226,193,113,.18);animation:b 2.6s ease-in-out infinite}.o img{width:100%;height:100%;border-radius:50%}.o i{position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:#e2c171;border-right-color:rgba(226,193,113,.35);animation:s 1.4s linear infinite}h1{margin:0;font-size:24px;color:#2b1a14}.a{margin:2px 0 14px;font:26px/1.4 "Amiri","Noto Naskh Arabic",serif;color:#b88a2e}.m{min-height:1.2em;font-size:13px;color:#7b6a5e;margin:0 0 12px}.d{display:flex;justify-content:center;gap:6px}.d b{width:8px;height:8px;border-radius:50%;background:#c9a24a;animation:p 1.2s infinite}.d b:nth-child(2){animation-delay:.15s}.d b:nth-child(3){animation-delay:.3s}@keyframes s{to{transform:rotate(360deg)}}@keyframes b{50%{transform:scale(1.04)}}@keyframes p{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.o,.o i,.d b{animation:none}}</style>
<script src="../config.js"></script>
</head>
<body>
<div id="w"><div class="c"><div class="o"><i></i><img src="icon-192.png" alt=""></div><h1>আল-ইত্তিহাদ ৫২</h1><p class="a">الاتحاد</p><p class="m" id="m"></p><div class="d"><b></b><b></b><b></b></div></div></div>
<script>
(function(){var u=window.IT_APP_URL,w=document.getElementById('w'),m=document.getElementById('m');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
function hasCopy(){try{return !!localStorage.getItem('ito')}catch(e){return false}}
function goOff(){location.replace('offline.html')}
if(!u){m.textContent='অ্যাপ এখনো চালু হয়নি';return}
/* নেট নেই → ফোনে রাখা অফলাইন কপি (offline.html নিজেই বলে দেয় কপি না থাকলে কী করতে হবে) */
if(!navigator.onLine){goOff();return}
var got=false;
/* অ্যাপ (Google-এর ফ্রেম) অনলাইনে থাকার সময় নিজের এনক্রিপ্ট করা কপি এখানে রেখে যায়; শুধু Google-এর ফ্রেম থেকেই নেওয়া হয় */
addEventListener('message',function(e){if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))return;var d=e.data||{};
 try{if(d.type==='it-off'&&d.blob&&d.key&&d.roll){got=true;localStorage.setItem('ito',JSON.stringify({roll:String(d.roll),name:String(d.name||''),at:d.at,blob:d.blob,key:d.key}));
   var lp=JSON.parse(localStorage.getItem('ipg:'+d.roll)||'null');if(lp&&lp.p&&lp.ts&&e.source)e.source.postMessage({type:'it-offprog',roll:String(d.roll),ts:lp.ts,p:lp.p},e.origin)}
  else if(d.type==='it-offclear'){Object.keys(localStorage).forEach(function(k){if(k==='ito'||k.indexOf('ipg:')===0)localStorage.removeItem(k)})}}catch(x){}});
var f=document.createElement('iframe');f.src=u+'';f.allow='clipboard-write';f.title='আল-ইত্তিহাদ ৫২';f.onload=function(){setTimeout(function(){w.className='out'},2200)};document.body.appendChild(f);
addEventListener('offline',function(){if(!got&&w.className!=='out')goOff()});
/* নেট খুব দুর্বল হলে: অপেক্ষার মাঝেই অফলাইন কপি খোলার সুযোগ */
setTimeout(function(){if(w.className!=='out'&&hasCopy()){m.innerHTML='🐢 নেট খুব ধীর — অপেক্ষা করুন, অথবা <button id="go" style="font:inherit;border:0;border-radius:10px;padding:6px 12px;background:#7a1f2b;color:#fff">📴 অফলাইন কপি খুলুন</button>';document.getElementById('go').onclick=goOff}},20000);
})();
</script>
</body>
</html>
