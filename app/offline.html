<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7a1f2b"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><link rel="manifest" href="manifest.json"><script>window.IT_OFFLINE=true;</script>
<title>আল-ইত্তিহাদ ৫২</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Anek+Bangla:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: শান্ত, পাণ্ডিত্যপূর্ণ, কিন্তু ঝকঝকে প্রিমিয়াম অ্যাপ
   IDEA: হাতে বাঁধানো দিওয়ানের পাতা আর বিভাগের রুটিন-বোর্ড — দুটো এক অ্যাপে
   PICTURE: হোমে আজকের রুটিন-কার্ড; কবিতায় বড় আরবি বাইত, নিচে স্তরে স্তরে অর্থ
   COLOUR and TYPE: মেরুন + সোনালি (আল-ইত্তিহাদ); Gen Z-এর ফন্ট — বাংলা Noto Sans Bengali/Anek Bangla, ইংরেজি Plus Jakarta Sans, সংখ্যা Outfit, আরবি Amiri/Naskh/Scheherazade
   LAYOUT: ফোনে এক কলাম + নিচে নেভিগেশন; বড় পর্দায় অ্যাপ মাঝখানে, অ্যাডমিন চওড়া */
:root{
 --bg:#f6f1ea;--card:#fffdf9;--ink:#22161a;--mute:#6b5d63;--line:#e7dcd1;--chip:#f2e9df;
 --brand:#7a1f2b;--brand2:#561520;--gold:#b88a2e;--goldsoft:#f5ead0;--ok:#2f7d4f;--warn:#a85a14;--bad:#b3261e;
 --ui:'Plus Jakarta Sans','Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;
 --hd:'Anek Bangla','Plus Jakarta Sans','Noto Sans Bengali',sans-serif;
 --num:'Outfit','Noto Sans Bengali','Plus Jakarta Sans',sans-serif;
 --ar:'Amiri','Noto Naskh Arabic','Scheherazade New','Noto Sans Bengali',serif;
 --arsize:30px;color-scheme:light}
body.t-dark{--bg:#140c0f;--card:#1f1519;--ink:#f3e9e4;--mute:#b8a8ad;--line:#3a2a30;--chip:#2b1d22;--goldsoft:#382b16;--brand:#d0606f;--brand2:#9c3443;color-scheme:dark}
body.t-sepia{--bg:#efe3cc;--card:#f8eed9;--ink:#3b2a17;--mute:#7a6247;--line:#dccaa8;--chip:#ead9b8}
body.t-ocean{--bg:#e8f1f5;--card:#fbfdfe;--ink:#0f2530;--mute:#557079;--line:#cfe0e7;--chip:#dcebf1;--brand:#0f5f7a;--brand2:#0b4a5f}
body.t-forest{--bg:#e9f0e6;--card:#fbfdf9;--ink:#15261a;--mute:#5a6e5e;--line:#d3e0d0;--chip:#dde9d9;--brand:#2f6b3f;--brand2:#22512f}
body.t-night{--bg:#0b1020;--card:#141a2e;--ink:#e7ebf6;--mute:#9aa5c4;--line:#273152;--chip:#1d2540;--goldsoft:#2b2a1c;--brand:#8fa2ff;--brand2:#5f72d6;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--ui);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--ui);color:inherit}
button{cursor:pointer;font-size:inherit}
input,select,textarea{font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--hd);font-weight:700;line-height:1.3;margin:0}
.num{font-family:var(--num)}
.ar{font-family:var(--ar);direction:rtl}
bdi.ar{font-size:1.12em}
.mute{color:var(--mute)}
.small{font-size:13.5px}
/* demo switch */
.demo{position:sticky;top:0;z-index:60;display:flex;gap:6px;align-items:center;justify-content:center;padding:7px;background:#1b1114;color:#f6e7c8;font-size:13px;flex-wrap:wrap}
.demo b{font-family:var(--hd);margin-inline-end:4px}
.demo button{border:1px solid #6d4a2c;background:transparent;border-radius:999px;padding:5px 14px;min-height:36px;color:#f6e7c8}
.demo button.on{background:#c9a24a;color:#1b1114;border-color:#c9a24a;font-weight:700}
/* student shell */
.wrap{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){.wrap{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(0,0,0,.35);margin-block:18px;border-radius:24px;overflow:clip;min-height:820px}}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;position:sticky;top:0;z-index:30}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font:700 19px var(--ar);color:#f3d58a;border:1px solid rgba(243,213,138,.4)}
.top .ttl{flex:1;line-height:1.25}
.top .ttl b{display:block;font:700 16.5px var(--hd)}
.top .ttl span{font-size:12.5px;opacity:.85}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:grid;place-items:center;position:relative}
.ib i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#f3d58a}
main{flex:1;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.bnav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:540px;box-sizing:border-box;height:calc(62px + env(safe-area-inset-bottom));align-items:stretch;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;padding:6px 0;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--mute);border-radius:12px}
.bnav button span{font-size:19px;line-height:1.2}
.bnav button.on{color:var(--brand);font-weight:700;background:var(--chip)}
/* cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:18px;margin-bottom:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 small{font:500 13px var(--ui);color:var(--mute)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sec h2{font-size:18px}
.sec button{border:0;background:none;color:var(--brand);font-weight:600;font-size:14px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;min-height:36px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.gold{background:var(--goldsoft);border-color:var(--gold)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hs>*{flex:none}
.pill{font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;display:inline-block;line-height:1.6}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok);color:var(--ok)}
.pill.w{background:var(--goldsoft);border-color:var(--gold)}
.pill.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:var(--bad);color:var(--bad)}
.pill.pro{background:linear-gradient(90deg,#c9a24a,#e7c977);border:0;color:#2a1a06;font-weight:700}
.btn{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(90deg,#c9a24a,#e2c171);color:#2a1a06}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--card);min-height:38px;font-size:14px}
.sw i{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on i{background:var(--ok)}.sw.on i::after{left:19px}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}
.hint{font-size:14px;color:var(--mute);margin:0 0 10px}
.empty{text-align:center;color:var(--mute);padding:18px 8px;font-size:14.5px}
/* home */
.hello{padding:4px 2px 10px}
.hello h1{font-size:24px}
.hello p{margin:2px 0 0;color:var(--mute);font-size:14px}
.rt{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card);margin-bottom:12px;box-shadow:0 14px 30px -24px rgba(60,10,20,.5)}
.rt-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(160deg,#2a1218,#4a1822);color:#fbeed2}
.rt-h b{font:700 17px var(--hd);flex:1}
.rt-h .seg2{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.rt-h .seg2 button{border:0;background:none;color:#fbeed2;border-radius:999px;padding:5px 12px;font-size:13.5px;min-height:34px}
.rt-h .seg2 button.on{background:#e2c171;color:#2a1a06;font-weight:700}
.rt-note{margin:10px 12px 0;padding:9px 12px;border-radius:12px;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.rt-note.info{background:var(--goldsoft);border:1px solid var(--gold)}
.rt-note.urgent{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad)}
.slot{display:grid;grid-template-columns:64px 6px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .tm{font:600 14px/1.3 var(--num);text-align:right;color:var(--mute)}
.slot .tm b{display:block;color:var(--ink);font-size:15.5px}
.slot .bar{align-self:stretch;border-radius:9px}
.slot .cn b{font:600 15.5px/1.35 var(--hd);display:block}
.slot .cn span{font-size:13px;color:var(--mute)}
.slot.done{opacity:.55}
.slot.now{background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.slot.cancel .cn b{text-decoration:line-through}
.slot.mk .cn b{color:var(--mute);font-weight:500}
.live{font-size:12px;font-weight:700;color:#fff;background:var(--ok);border-radius:999px;padding:2px 9px;white-space:nowrap}
.rt-f{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13.5px;color:var(--mute);border-top:1px solid var(--line)}
.rt-f button{border:0;background:none;color:var(--brand);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.course{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:start;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;gap:4px}
.course::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.course .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 14%,var(--card));margin-top:4px}
.course .cd{font:700 12.5px var(--num);color:var(--c);letter-spacing:.02em}
.course b{font:700 15.5px/1.3 var(--hd)}
.course .en{font-size:12.5px;color:var(--mute);line-height:1.35}
.course .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.mini{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 14px var(--num)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--chip);border-radius:14px;padding:10px 4px}
.stats b{display:block;font:700 22px var(--num);color:var(--brand)}
.stats span{font-size:12.5px;color:var(--mute)}
.notice{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice .d{font-size:12.5px;color:var(--mute)}
.wotd{background:linear-gradient(150deg,var(--card),var(--goldsoft));}
.wotd .big{font:700 40px/1.4 var(--ar);text-align:center;color:var(--brand);direction:rtl}
/* routine page */
.daytabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.daytabs button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;min-height:56px;line-height:1.25;font-size:13px}
.daytabs button b{display:block;font:700 16px var(--num)}
.daytabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.daytabs button.today{box-shadow:inset 0 -3px 0 var(--gold)}
.wk{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px;table-layout:fixed}
.wk th{font:600 11.5px var(--ui);color:var(--mute);padding:2px}
.wk td{border-radius:8px;padding:5px 3px;text-align:center;vertical-align:middle;line-height:1.25;background:var(--chip)}
.wk td b{font:700 12px var(--num);display:block}
.wk td.td{outline:2px solid var(--gold)}
/* poem reader */
.phero{border-radius:20px;padding:14px 14px 16px;color:#fff;background:linear-gradient(160deg,var(--brand),var(--brand2));position:relative;overflow:hidden;margin-bottom:10px}
.phero::after{content:"";position:absolute;right:-50px;bottom:-70px;width:190px;height:190px;border-radius:50%;border:22px solid rgba(226,193,113,.18)}
.phero .ar{font:700 31px/1.6 var(--ar);text-align:right;position:relative;z-index:1}
.phero h2{font-size:21px;margin:0 0 8px;position:relative;z-index:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.meta span{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:2px 10px;border-radius:999px}
.ptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;position:sticky;top:64px;z-index:20;background:var(--bg)}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;min-height:38px;white-space:nowrap}
.ptabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ptabs button sup{font-size:10px;color:var(--gold);margin-inline-start:2px}
.tool{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.lbl{font-size:12.5px;color:var(--mute)}
.bayt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 8px;margin-bottom:14px;position:relative}
.bnum{position:absolute;top:10px;left:12px;font:700 13px var(--num);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:0 7px;line-height:1.6}
.flag{position:absolute;top:9px;left:50px;font-size:12px;color:var(--warn);background:var(--goldsoft);border-radius:8px;padding:1px 8px;border:0}
.misra{direction:rtl;text-align:center;font-family:var(--ar);font-size:var(--arsize);line-height:2.05;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em}
@media(min-width:520px){.side .misras{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.w{border-radius:8px;padding:0 3px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;transition:background .15s}
.w:hover,.w.peek,.w.sel{background:var(--goldsoft)}
.w.sel{box-shadow:inset 0 -2px 0 var(--gold)}
.w .g{font:500 12.5px/1.3 var(--ui);color:var(--brand);direction:ltr;max-width:7.5em;text-align:center;margin-top:-4px}
.w.hid{color:transparent;background:linear-gradient(var(--line),var(--line)) 0 72%/100% 3px no-repeat}
.w.hid.peek{color:var(--ink);background:var(--goldsoft)}
.lay{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.lay h4{font:600 12.5px var(--ui);color:var(--gold);margin-bottom:2px}
.lay p{margin:0;font-size:15.5px}
.arp{direction:rtl;text-align:right;font:18px/1.95 var(--ar)}
.lay.blur>:not(h4){filter:blur(6px);cursor:pointer;user-select:none}
.lit{display:flex;flex-wrap:wrap;gap:5px;direction:rtl}
.lit span{background:var(--chip);border-radius:10px;padding:3px 9px;font-size:13px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.35}
.lit span b{font:600 19px/1.6 var(--ar)}
.bfoot{display:flex;gap:2px;justify-content:flex-end;margin-top:6px}
.bfoot button{border:0;background:none;border-radius:10px;padding:6px 8px;font-size:13.5px;color:var(--mute);min-height:38px}
.bfoot button.on{color:var(--brand);font-weight:600}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:start;vertical-align:top}
table.t th{font:600 12.5px var(--ui);color:var(--mute)}
td.ar{font-size:19px;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:4px;direction:rtl;justify-content:center;margin:4px 0}
.seg span{border:1px solid var(--line);border-radius:10px;padding:2px 8px;text-align:center;font:20px/1.6 var(--ar)}
.seg span small{display:block;font:600 11.5px var(--ar);color:var(--brand)}
.seg span.v{border-color:var(--gold);background:var(--goldsoft)}
.mcq button{display:block;width:100%;text-align:start;margin:6px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
.mcq button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.mcq button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fc{perspective:900px;height:230px;margin:6px 0 12px}
.fc .in{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-align:center;padding:16px}
.fc .f{font:700 46px var(--ar);background:linear-gradient(160deg,var(--card),var(--goldsoft))}
.fc .b{transform:rotateY(180deg)}
.ans{display:none;margin-top:8px;padding:10px;border-radius:12px;background:var(--chip);font-size:15px}
.ans.show{display:block}
.slots{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0}
.slots button,.pool button{font:22px var(--ar);border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:2px 10px;min-height:44px}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.lock{text-align:center;padding:26px 14px}
.lock .big{font-size:36px}
.lock h3{justify-content:center}
.kv{display:grid;grid-template-columns:7.2em 1fr;gap:6px 10px;font-size:15px;margin:0}
.kv dt{color:var(--mute);font-size:13.5px;padding-top:2px}
.kv dd{margin:0}

.devi>div{flex:1;min-width:0}.devi b{display:block;font-size:15px}.devi small{color:var(--mute);font-size:12.5px}
.devi .di{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--chip);font-size:18px;flex:none}
.devi.pend{border-color:var(--gold);background:var(--goldsoft)}
.btn.warn,.chip.warn{background:#b3261e!important;color:#fff!important;border-color:#b3261e!important}
/* ===== প্রোফাইল ===== */
.pf-head{display:flex;gap:16px;align-items:center}
.pf-av{width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:32px;background:var(--chip) center/cover no-repeat;box-shadow:0 0 0 3px var(--goldsoft),0 10px 24px -14px rgba(60,10,20,.6)}
.pf-av.has{font-size:0}
.av.has{background:center/cover no-repeat;font-size:0}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media(max-width:520px){.pf-grid{grid-template-columns:1fr}}
.pf-l{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
.pf-wide{grid-column:1/-1}
.pf-i{width:100%;font-size:15.5px;color:var(--ink);padding:11px 12px;border-radius:12px}
.pf-i:disabled{opacity:.55}
.arfield{font-family:'Amiri','Noto Naskh Arabic',serif!important;font-size:19px!important;direction:rtl;text-align:right;line-height:1.5}
.enfield{font-family:'Plus Jakarta Sans','Noto Sans Bengali',sans-serif}
.pf-note{font-size:13.5px;line-height:1.6;color:var(--ink);background:var(--goldsoft);border-color:var(--gold)}
.pf-link b{font-size:16px}
/* ===== ফটোকার্ড ===== */
.pc-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.pc-sw button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:12px;color:var(--mute);cursor:pointer}
.pc-sw i{width:46px;height:46px;border-radius:50%;display:block;transition:transform .15s,box-shadow .15s}
.pc-sw button.on i{transform:scale(1.08);outline:3px solid var(--gold);outline-offset:3px}
.pc-sw button.on span{color:var(--ink);font-weight:600}
.pc-lay{display:flex;gap:6px}.pc-lay button{flex:1}
.pc-in.arfield{font-size:20px!important}
/* ===== ভিন্ন পাঠ ===== */
details.alt{margin:10px 0 0;border:1px dashed var(--gold);border-radius:14px;padding:6px 12px;background:var(--goldsoft)}
details.alt summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--brand);padding:4px 0}
.alt-i{padding:10px 0;border-top:1px solid var(--line)}.alt-i:first-of-type{border-top:0}
.alt-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alt-w{font-size:20px}.alt-r{font-size:var(--arsize,24px);line-height:1.8;margin:6px 0 2px;color:var(--brand)}
.alt-n{margin:4px 0;font-size:14.5px}
.alt-g{padding:10px 0;border-top:1px solid var(--line)}.alt-g:first-of-type{border-top:0}
.alt-gh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.alt-gh .ar{font-size:17px;color:var(--mute)}
.ctb-b{font-size:22px;line-height:1.9;text-align:center;padding:8px;background:var(--chip);border-radius:12px;margin:0 0 10px}
.ctb-f{padding:10px 12px;margin:0 0 10px}.ctb-f ol{margin:6px 0;padding-inline-start:20px}
.ctb-k{display:flex;flex-wrap:wrap;gap:6px}
/* ===== নেটের অবস্থা ===== */
.netbar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:300;max-width:min(92vw,460px);padding:10px 16px;border-radius:999px;font:500 13.5px/1.4 'Noto Sans Bengali',sans-serif;color:#fff8ec;background:linear-gradient(160deg,#5a1622,#2a0a10);box-shadow:0 14px 30px -12px rgba(0,0,0,.55),0 0 0 1.5px rgba(226,193,113,.5);text-align:center;transition:transform .35s ease;pointer-events:none}
.netbar.show{transform:translate(-50%,0)}
.netbar.off{background:linear-gradient(160deg,#3a3a3a,#161616)}
.netbar.ok{background:linear-gradient(160deg,#1f5e4a,#0d2e24)}
.stat.hot{border-color:var(--gold);background:var(--goldsoft)}
/* ===== দ্রুত ঘোষণা ===== */
.qx{border-color:var(--gold)}
.qx-st{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:600;font-size:14px}
.qx-st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:12.5px;flex:none}
.qx-ch{display:flex;flex-wrap:wrap;gap:6px}
.qx-sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qx-slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:var(--ink)}
.qx-slot b{font-size:14px}.qx-slot span{font-size:13.5px;line-height:1.3}.qx-slot small{color:var(--mute);font-size:11.5px}
.qx-slot.on{border-color:var(--gold);background:var(--goldsoft);box-shadow:0 0 0 2px var(--gold) inset}
.qx-man{margin-top:10px}.qx-man summary{cursor:pointer;color:var(--brand)}
.qx-pv{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--goldsoft);font-size:13.5px;line-height:1.6}
/* রুটিনে ঘোষণার চিহ্ন */
.slot.hasev{box-shadow:inset 3px 0 0 var(--gold)}
.evb{display:block;margin-top:5px;padding:5px 9px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--gold);font-size:12.5px;line-height:1.45;color:var(--ink)}
.evb b{color:var(--brand)}
.nt.ev{border-inline-start:3px solid var(--gold);padding-inline-start:10px;margin:8px 0}
.nt-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
/* ===== বের হওয়ার জিজ্ঞাসা ===== */
.exit-m{text-align:center;padding:6px 4px 2px}
.exit-l{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;box-shadow:0 12px 28px -12px rgba(58,15,23,.7),0 0 0 4px rgba(226,193,113,.25)}
.exit-l img{width:100%;height:100%;border-radius:50%}
.exit-m h3{margin:0 0 6px;font-size:19px}
.exit-b{gap:10px;margin-top:14px}.exit-b .btn{flex:1;padding:12px}

.bayt.flash{box-shadow:0 0 0 3px var(--gold);transition:box-shadow .3s}
.bayt{scroll-margin-top:130px}
.offb{background:linear-gradient(160deg,#2f2f2f,#161616);color:#f3ece0;border:0}.offb .small{color:#d9cfc0;margin:4px 0 8px}
.pnudge{display:flex;gap:12px;align-items:center}.pnudge .ring{flex:none}.ring.sm{width:46px;height:46px;flex:none}.ring.sm span{width:35px;height:35px;font-size:11px}.linkc .ring.sm{margin-inline-end:10px}
#tour{position:fixed;inset:0;z-index:400}
#tour .t-dim{position:fixed;inset:0;background:rgba(18,8,10,.62)}
#tour .t-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(18,8,10,.62),0 0 0 3px #e2c171;transition:all .25s;pointer-events:none}
#tour .t-card{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,400px);background:var(--card);color:var(--ink);border-radius:20px;padding:16px 16px 12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:tIn .25s ease}
#tour .t-card h3{margin:6px 0 4px;font:700 18px var(--hd,var(--ui))}#tour .t-card p{margin:0 0 12px;font-size:14.5px;line-height:1.65}
#tour .t-dots{display:flex;gap:4px}#tour .t-dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}#tour .t-dots i.on{width:18px;background:var(--gold,#c9a24a)}
#tour .t-b{align-items:center;gap:6px}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* পড়ার ভাসমান বোতাম ও প্যানেল */
#rfab{position:fixed;z-index:40;right:max(14px,calc(50vw - 270px + 14px));bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#f6e7c8;font-size:22px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent);display:grid;place-items:center;cursor:pointer;transition:transform .25s ease}
#rfab span{transition:transform .3s ease;display:block;line-height:1}
#rfab.on span{transform:rotate(90deg)}
#rfab:active{transform:scale(.92)}
#rpanel{position:fixed;z-index:39;left:50%;bottom:calc(136px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 16px));max-height:calc(100vh - 210px);overflow:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:14px 14px 16px;box-shadow:0 -10px 40px -12px rgba(0,0,0,.45);transform:translate(-50%,16px);opacity:0;transition:transform .22s ease,opacity .22s ease}
#rpanel.show{transform:translate(-50%,0);opacity:1}
.rp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.rp-h b{font-family:var(--hd);font-size:16px}
.rp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rp-t{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.rp-t span{font-size:18px;line-height:1.2}.rp-t.on{background:var(--chip);border-color:var(--brand);color:var(--brand);font-weight:700}
.rp-l{font-size:12.5px;color:var(--mute);margin:12px 0 6px;font-weight:600}
.rp-sz{justify-content:space-between;align-items:center}
.rp-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rp-tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 4px;font-size:12.5px}.rp-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(max-width:360px){.rp-g{grid-template-columns:repeat(2,1fr)}.rp-tabs{grid-template-columns:repeat(2,1fr)}}
@media print{#rfab,#rpanel{display:none!important}}

/* অনুশীলনের খেলা */
.pg-stat{gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}.pg-stat b{color:var(--ink)}
.pg-prog{margin-top:8px}
.pg-big{font-size:38px;text-align:center;margin:6px 0 10px;line-height:1.5}.pg-mid{font:600 18px/1.6 var(--ui);text-align:center;margin:6px 0 12px}
.pg-mis{font-size:calc(var(--arsize,30px)*.8);text-align:center;line-height:1.9;margin:6px 0 12px}
.pg-gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center}
.pg-opts{display:grid;gap:8px}.pg-opts button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 14px;text-align:start;font:500 15px/1.5 var(--ui);transition:transform .12s,background .2s,border-color .2s}
.pg-opts.ar-o button{font-family:var(--ar);font-size:22px;text-align:right;direction:rtl}
.pg-opts button:not(:disabled):active{transform:scale(.98)}
.pg-opts button.right{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}.pg-opts button.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.pg-slots{min-height:52px;direction:rtl}.pg-pool{direction:rtl}.pg-slots button,.pg-pool button{font-size:22px}
.pg-fb{margin-top:12px;padding:10px 12px;border-radius:12px;animation:pgIn .25s ease}.pg-fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card))}.pg-fb.no{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.pg-nav{margin-top:12px}
.pg-end .pg-trophy{font-size:54px;text-align:center;animation:pgIn .4s ease}
.pg-why{border-inline-start:3px solid var(--gold);padding:4px 10px;margin:6px 0;font-size:14px}
@keyframes pgIn{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
body.inpoem main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,rgba(226,193,113,.25),transparent 40%),linear-gradient(160deg,#7a1f2b,#3a0f17)}
.lgc{background:var(--card);border-radius:24px;padding:26px 22px;width:min(380px,100%);display:grid;gap:10px;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.lgc h1{font-size:24px}.lgc input{width:100%;text-align:center;font-size:18px;padding:12px}.lgc .btn{width:100%;min-height:48px;font-size:16px}
.logo.big{width:64px;height:64px;font-size:34px;margin:0 auto;background:var(--brand);color:#f3d58a;border-radius:20px;display:grid;place-items:center;font-family:var(--ar)}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;padding:6px}
.lerr{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad);border-radius:12px;padding:8px;font-size:14px}
.lgc{gap:12px}.lgc .lbl2{font-size:13px;color:var(--mute);text-align:start;margin-bottom:-6px}
.lgo{position:relative;width:108px;height:108px;margin:0 auto 4px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,#f3e6cc);box-shadow:0 10px 30px -10px rgba(122,31,43,.55),inset 0 0 0 2px rgba(184,138,46,.35)}
.lgo img{width:74px;height:74px;object-fit:contain;position:relative;z-index:1}
.lgo .ring{position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:#e2c171;border-right-color:rgba(226,193,113,.35);animation:spin 1.4s linear infinite}
.sp{padding-top:34px}.sp h1{font-size:26px;letter-spacing:.01em}.sp-ar{font-size:26px;color:var(--gold);margin:-8px 0 0;line-height:1.4}.sp-msg{min-height:1.2em}
.lgo{animation:breathe 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.04)}}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.who{display:flex;flex-direction:column;align-items:center;background:var(--chip);border-radius:14px;padding:10px}.who b{font-size:17px}.who span{font-size:13px;color:var(--mute)}
.lok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid var(--ok);border-radius:12px;padding:8px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-inline-end:8px;vertical-align:-2px}
@media(prefers-reduced-motion:reduce){.lgo,.lgo .ring,.dots i{animation:none}}
</style>

 :`<div class="card"><div class="empty">📦 এই কোর্সের কনটেন্ট শীঘ্রই আসছে।<br>সিলেবাস পেলে ইউনিট অনুযায়ী সাজানো হবে।</div></div>`}${acc("materials")==="ok"&&S.materials.some(m=>String(m.course)===c.id)?`<div class="sec"><h2>📂 ম্যাটেরিয়াল</h2></div><div id="cmat"></div>`:""}${acc("qbank")==="ok"&&S.qbank.some(q=>String(q.course)===c.id)?`<div class="sec"><h2>🗂️ প্রশ্নব্যাংক</h2></div><div id="cqb"></div>`:""}${acc("teachers")==="ok"&&S.teachers.some(t=>tCourses(t).includes(c.id))?`<div class="sec"><h2>👨‍🏫 শিক্ষক</h2></div><div id="ctc"></div>`:""}`
 if($("#cmat"))vMaterials($("#cmat"),c.id);if($("#cqb"))vQbank($("#cqb"),c.id);if($("#ctc"))vTeachers($("#ctc"),c.id);}

const PT=[["poem","📜 কবিতা"],["parts","🧭 কাঠামো"],["vocab","📚 শব্দভান্ডার"],["tarkib","🧩 তারকিব"],["balagha","✨ বালাগাত"],["meter","🎵 ছন্দ"],["variants","⚖️ পাঠভেদ"],["context","🏜️ প্রেক্ষাপট"],["poet","👤 কবি"],["memo","🧠 মুখস্থ"],["practice","🎯 অনুশীলন"],["flash","🃏 ফ্লাশকার্ড"],["qs","❓ প্রশ্ন"],["notes","📝 নোট"]];

 const vis=PT.filter(t=>acc(t[0])!=="off"&&!(t[0]==="variants"&&!VAR.length&&!ALT.length));if(!vis.find(t=>t[0]===S.tab))S.tab=vis[0]?vis[0][0]:"poem";

 <div id="tool">${toolHTML()}</div><div id="pane"></div>`;

function toolHTML(){
 if(S.tab!=="poem"&&S.tab!=="memo")return"";
 const L=[["lit","শব্দে শব্দে"],["bn","বাংলা"],["en","English"],["ex","ব্যাখ্যা"],["tk","তারকিব"],["bl","বালাগাত"],["sh","শরহ (আরবি)"]];
 const lk=k=>(k==="tk"&&acc("tarkib")!=="ok")||(k==="bl"&&acc("balagha")!=="ok");
 return `<div class="tool"><div class="row"><button class="sw ${S.harakat?"on":""}" data-sw="harakat"><i></i>হরকত</button><button class="sw ${S.gloss?"on":""}" data-sw="gloss"><i></i>শব্দের নিচে অর্থ</button><button class="sw ${S.blur?"on":""}" data-sw="blur"><i></i>লুকিয়ে যাচাই</button></div>
 ${S.tab==="poem"?`<div class="hs"><button class="chip gold" data-pre="ar">শুধু আরবি</button><button class="chip gold" data-pre="tr">আরবি + অনুবাদ</button><button class="chip gold" data-pre="all">সব দেখাও</button></div><div class="row">${L.map(l=>`<button class="chip ${S.layers[l[0]]&&!lk(l[0])?"on":""}" data-lay="${l[0]}" ${lk(l[0])?'data-lk="1"':""}>${l[1]}${lk(l[0])?" 🔒":""}</button>`).join("")}</div>`:""}
 ${!S.harakat?`<div class="small mute">হরকত ছাড়া পড়ছেন — কোনো শব্দে একবার চাপলে সেটার হরকত দেখাবে।</div>`:""}</div>`}
const memoHide=(bi,si,wi)=>{const l=S.memo;if(!l)return false;if(l>=4)return true;const k=(bi*7+si*3+wi*5)%10;return l===1?k<2:l===2?k<5:k<8};
function wordHTML(t,bi,si,wi){const[w,id]=t;const hide=S.tab==="memo"&&memoHide(bi,si,wi);const txt=S.harakat?w:strip(w);
 return `<span class="w ${hide?"hid":""}" data-id="${id}" data-full="${esc(w)}" data-plain="${esc(txt)}" role="button" tabindex="0"><span class="t">${esc(txt)}</span>${S.gloss&&!hide?`<span class="g">${esc(W[id].bn)}</span>`:""}</span>`}

 const L=(k,h,body)=>S.layers[k]?`<div class="lay ${S.blur?"blur":""}"><h4>${h}</h4>${body}</div>`:"";

 <div class="misras"><div class="misra">${b.s1.map((t,i)=>wordHTML(t,bi,0,i)).join("")}</div><div class="misra">${b.s2.map((t,i)=>wordHTML(t,bi,1,i)).join("")}</div></div>

 <div class="bfoot">${P?`<button data-bm="${b.n}" class="${S.bm[b.n]?"on":""}">🔖 ${S.bm[b.n]?"রাখা আছে":"বুকমার্ক"}</button>${acc("notes")==="ok"?`<button data-note="${b.n}" class="${S.bnotes[b.n]?"on":""}">📝 নোট</button>`:""}${acc("report")==="ok"?`<button data-rep="bayt:${b.n}">🐞 ভুল জানাও</button>`:""}${acc("contrib")==="ok"?`<button data-ctb="${b.n}">✍️ ভিন্ন পাঠ</button>`:""}`:`<button data-know="${b.n}">😕 পারি না</button><button data-know="${b.n}" data-ok="1" class="${S.knownB.has(b.n)?"on":""}">✅ পারি</button>`}</div></article>`}

function tourStart(force){try{if(window.IT_OFFLINE)return;if(!force&&localStorage.getItem(TGK()))return}catch(e){}

 if(+m.ts>lt&&+m.ts>LASTMSGTS){LASTMSGTS=+m.ts;restoreProg(m.p);progLocal();DIRTY=true;LASTP="";flushProg(true);keepScroll(render);toast("📴 অফলাইনে করা নোট/বুকমার্ক যুক্ত হয়েছে")}}catch(x){}});
let LASTMSGTS=0,OFFB=null;
async function offLoad(){try{const v=JSON.parse(localStorage.getItem("ito")||"null");if(!v||!v.blob)return null;const[a,b]=v.blob.split(".");
 const k=await crypto.subtle.importKey("raw",b64u8(v.key),"AES-GCM",false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(a)},k,b64u8(b))))}catch(e){return null}}
function offLock(){if(!window.IT_OFFLINE)return"";if(!(OFFB&&OFFB.savedAt))return"notsaved";if(Date.now()>offUntil())return"expired";return""}
function offLockMsg(){const r=offLock();return r==="expired"?"⏰ অফলাইন কপির মেয়াদ শেষ — একবার ইন্টারনেট চালু করে অ্যাপ খুলুন, নিজে থেকেই নতুন হয়ে যাবে।":"📴 এই পাঠটা অফলাইনে রাখা হয়নি। ইন্টারনেট চালু করে কবিতা খুলে উপরের 💾 চাপুন — তারপর নেট ছাড়াও পড়তে পারবেন।"}
function offBanner(){return window.IT_OFFLINE?`<div class="card offb"><b>📴 আপনি অফলাইনে আছেন</b><div class="small">ফোনে রাখা তথ্য দেখাচ্ছে${OFFB&&OFFB.at?` (হালনাগাদ: ${new Date(OFFB.at).toLocaleString("bn-BD",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})})`:""}। নতুন তথ্য পেতে ইন্টারনেট চালু করে অ্যাপ আবার খুলুন।${offLock()?"":` · অফলাইন পড়ার মেয়াদ: ${new Date(offUntil()).toLocaleDateString("bn-BD",{day:"numeric",month:"long"})} পর্যন্ত`}</div><button class="btn sm" data-goonline="1">🔄 অনলাইনে চেষ্টা করুন</button></div>`:""}
async function startOffline(host){
 const v=await offLoad();
 if(!v||!v.d||!v.d.me){$("#student").style.display="none";return splash(host,"📴 ইন্টারনেট নেই। প্রথমবার ইন্টারনেট চালু করে অ্যাপটা একবার খুলুন — তারপর নেট ছাড়াও খোলা যাবে।",`<div class="row" style="justify-content:center"><button class="btn" onclick="location.replace('./')">আবার চেষ্টা</button></div>`)}
 OFFB={savedAt:v.savedAt||0,at:v.pts||0};TOKEN="offline";applyBoot(v.d);
 if(v.p)restoreProg(v.p);try{const lp=JSON.parse(localStorage.getItem(PKEY())||"null");if(lp&&lp.p&&lp.ts>(v.pts||0))restoreProg(lp.p)}catch(e){}
 S.saved=!!OFFB.savedAt;if(offLock()){B=[];W={};TOK=[];VAR=[];ALT=[];QS=[]}
 LASTP=progSend();host.style.display="none";$("#student").style.display="";render();navInit();
 addEventListener("online",()=>netSay("✅ ইন্টারনেট এসেছে — নতুন তথ্য পেতে 🔄 «অনলাইনে চেষ্টা করুন» চাপুন","ok"))}
function progObj(){return{pct:B.length?Math.round(S.seen.size/B.length*100):0,seen:[...S.seen],knownB:[...S.knownB],knownW:[...S.knownW],tapped:[...S.tapped].slice(-300),star:Object.keys(S.star),bnotes:S.bnotes,bm:S.bm,mcq:S.mcq,pst:S.pst||{},cg:(S.cg||[]).filter(r=>r.cr!==""||r.mk!==""),ui:{theme:S.theme,font:S.font,size:S.size,harakat:S.harakat}}}
/* অগ্রগতি: ঘনঘন না পাঠিয়ে থেমে থেমে (ব্যাটারি ও নেট বাঁচে); অ্যাপ থেকে বের হলেই শেষবার পাঠানো */
/* হঠাৎ কেটে দিলেও না হারানো: প্রতিটা বদল সঙ্গে সঙ্গে ফোনে লেখা; সার্ভার নিশ্চিত করলে চিহ্ন; পরের বার বাকি থাকলে নিজে পাঠানো */
const PKEY=()=>"ipg:"+(ME0&&ME0.roll||""),SKEY=()=>"ipgs:"+(ME0&&ME0.roll||"");
function progLocal(){try{if(ME0&&ME0.roll)localStorage.setItem(PKEY(),JSON.stringify({ts:Date.now(),p:progObj()}))}catch(e){}}
function progRecover(){try{const v=JSON.parse(localStorage.getItem(PKEY())||"null"),sent=+(localStorage.getItem(SKEY())||0);if(v&&v.p&&v.ts>sent){restoreProg(v.p);DIRTY=true;LASTP="";setTimeout(()=>flushProg(true),1500)}}catch(e){}}
function progSend(){const p=progObj();let s=JSON.stringify(p);if(s.length>40000){p.tapped=[];s=JSON.stringify(p)}if(s.length>40000){p.knownW=p.knownW.slice(-300);s=JSON.stringify(p)}return s}
function flushProg(final){clearTimeout(PT_);if(!TOKEN||!ME0.roll)return;progLocal();const s=progSend();if(s===LASTP)return;LASTP=s;const ts=Date.now();
 call("progress",{progress:JSON.parse(s),final:!!final}).then(r=>{if(r&&r.ok)try{localStorage.setItem(SKEY(),String(ts))}catch(e){}}).catch(()=>{})}
function saveSoon(){setTimeout(progLocal,0);clearTimeout(PT_);PT_=setTimeout(()=>flushProg(false),15000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden){progLocal();flushProg(true)}});
addEventListener("pagehide",()=>{flushProg(true);offSync()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)offSync()});
document.addEventListener("click",()=>{if(TOKEN&&ME0.roll)saveSoon()},true);
/* ফোনে এনক্রিপ্ট করা ক্যাশ — একবার চালু হলে পরের বার সাথে সাথে খোলে, পেছনে নতুন তথ্য আসে */
const u8b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function ckey(){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode((TOKEN||"")+"|ittihad-cache"));return crypto.subtle.importKey("raw",h,"AES-GCM",false,["encrypt","decrypt"])}
async function cacheSave(d){try{const k=await ckey(),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(d))));localStorage.setItem("itc",u8b64(iv)+"."+u8b64(ct))}catch(e){}}
async function cacheLoad(){try{const v=localStorage.getItem("itc");if(!v)return null;const[a,b]=v.split(".");const k=await ckey();return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(a)},k,b64u8(b))))}catch(e){return null}}
let DIRTY=false,LASTB="",LASTFETCH=0;
document.addEventListener("click",()=>{DIRTY=true},true);
async function fetchFresh(manual,bg){if(window.IT_OFFLINE){if(manual)toast(OFFMSG);return false}LASTFETCH=Date.now();const d=await call("boot",{},bg&&!manual);if(!d.ok){if(manual)toast(d.err);return d.slow?d:false}
 try{const dv=String((d.set||{}).data_ver||1),old=localStorage.getItem("itdv:"+d.me.roll);if(old&&old!==dv){localStorage.removeItem("itc");LASTB="";if(!manual)toast("🔄 নতুন তথ্য এসেছে — পুরনো কপি বদলে নতুনটা রাখা হলো")}localStorage.setItem("itdv:"+d.me.roll,dv)}catch(e){}
 const j=JSON.stringify({...d,today:""});if(j!==LASTB){LASTB=j;const keep=DIRTY?progObj():null;applyBoot(d);if(keep){restoreProg(keep)}whenIdle(()=>{if(!$("#modal").classList.contains("show")&&!$("#sheet").classList.contains("show")&&!$("#viewer").classList.contains("show")&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))keepScroll(render)});cacheSave(d)}
 offSync();
 if(manual)toast("✅ সব তথ্য হালনাগাদ");return true}
function restoreProg(p){S.seen=new Set(p.seen||[]);S.knownB=new Set(p.knownB||[]);S.knownW=new Set(p.knownW||[]);S.tapped=new Set(p.tapped||[]);S.star=Object.fromEntries((p.star||[]).map(k=>[k,1]));S.bnotes=p.bnotes||{};S.bm=p.bm||{};S.pst=p.pst||{};S.mcq=p.mcq||{};if(p.cg)S.cg=p.cg}
function hardRefresh(){toast("নতুন তথ্য আনা হচ্ছে…");fetchFresh(true)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TOKEN&&Date.now()-LASTFETCH>120000)fetchFresh(false,true)});
/* ===== ব্যাক বাটন: আগে খোলা জিনিস বন্ধ → আগের পাতা → হোমে থাকলে বের হওয়ার আগে জিজ্ঞাসা ===== */
const NAVH={on:false,leaving:false,asking:false};
const GHIS=()=>{try{return google.script.history&&google.script.history.setChangeHandler?google.script.history:null}catch(e){return null}};
function histPush(){if(NAVH.leaving)return;try{const g=GHIS();if(g)g.push({t:1},{},"");else history.pushState({t:1},"")}catch(e){}}
function backStep(){
 if($("#modal").classList.contains("show")){closeModal();return true}
 if($("#sheet").classList.contains("show")){closeSheet();return true}
 if($("#viewer").classList.contains("show")){$("#viewer").classList.remove("show");$("#viewer").innerHTML="";return true}
 if(S.view==="course"){if(S.poem)memo(()=>{S.poem=false});else go("courses");return true}
 if(S.view!=="home"){go("home");return true}
 return false}
function onBack(){if(NAVH.leaving)return;if(NAVH.asking){NAVH.asking=false;NAVH.leaving=true;flushProg(true);closeModal();try{history.back()}catch(e){}return}
 if(backStep())histPush();else exitAsk()}
function exitAsk(){NAVH.asking=true;
 modal(`<div class="exit-m"><div class="exit-l"><img src="${LOGO}" alt=""></div><h3>অ্যাপ থেকে বের হবেন?</h3><p class="hint">তোমার পড়ার অগ্রগতি সংরক্ষিত আছে — আবার খুললে যেখানে ছিলে সেখান থেকেই শুরু।</p><div class="row exit-b"><button class="btn gold" id="exStay">থাকি</button><button class="btn ghost" id="exGo">বের হই</button></div></div>`);
 const stay=()=>{if(!NAVH.asking)return;NAVH.asking=false;closeModal();histPush()};
 $("#exStay").onclick=stay;$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")stay()},{once:true});
 $("#exGo").onclick=()=>{NAVH.asking=false;NAVH.leaving=true;flushProg(true);closeModal();try{history.back()}catch(e){}setTimeout(()=>{if(!document.hidden)toast("বের হতে আরেকবার ব্যাক চাপো")},700)}}
function navInit(){if(NAVH.on)return;NAVH.on=true;const g=GHIS();
 try{if(g){g.replace({base:1},{},"");g.push({t:1},{},"");g.setChangeHandler(e=>{if(e&&e.state&&e.state.t)return;onBack()})}
 else{history.replaceState({base:1},"");history.pushState({t:1},"");addEventListener("popstate",e=>{if(e.state&&e.state.t)return;onBack()})}}catch(e){}}
async function start(){
 const host=$("#login");
 try{
 if(window.IT_OFFLINE)return startOffline(host);
 if(!TOKEN){try{localStorage.removeItem("itc")}catch(e){}offClear();$("#student").style.display="none";return loginView(host,"আল-ইত্তিহাদ ৫২","আরবি বিভাগ · চট্টগ্রাম বিশ্ববিদ্যালয়",start)}
 const c=await cacheLoad();
 if(c&&c.me){try{applyBoot(c);LASTB=JSON.stringify({...c,today:""});LASTP=progSend();progRecover();S.saved=!!savedAt();host.style.display="none";$("#student").style.display="";render();navInit();offSync();setTimeout(()=>tourStart(false),900);fetchFresh(false,true).catch(()=>{})}catch(e){try{localStorage.removeItem("itc")}catch(x){}return start()}}
 else{splash(host,"আপনার ক্লাসরুম সাজানো হচ্ছে…");
  const r=await withTimeout(fetchFresh(),45000);
  if(r!==true){return failView(host,r&&r.slow?"সার্ভার সাড়া দিতে দেরি করছে। ইন্টারনেট দেখে আবার চেষ্টা করুন।":"তথ্য আনা যায়নি। আবার চেষ্টা করুন।",start)}
  LASTP=progSend();progRecover();S.saved=!!savedAt();host.style.display="none";$("#student").style.display="";render();navInit();offSync();setTimeout(()=>tourStart(false),900)}
 }catch(e){console.error(e);return failView(host,"কিছু একটা ঠিকমতো লোড হয়নি। আবার চেষ্টা করুন।",()=>{try{localStorage.removeItem("itc")}catch(x){}start()})}
 if(!window.__tick){window.__tick=setInterval(()=>{if(document.hidden)return;if(Date.now()-LASTFETCH>600000)fetchFresh(false,true).catch(()=>{});else if(S.view==="home"&&!$("#modal").classList.contains("show")&&!$("#sheet").classList.contains("show")&&Date.now()-LASTMOVE>5000)try{keepScroll(render)}catch(e){}},60000)}
}
start();

}
