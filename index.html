<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আল-ইত্তিহাদ ৫২">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>আল-ইত্তিহাদ ৫২</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#3a0f17}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#w{position:fixed;inset:0;display:grid;place-items:center;color:#f3d58a;font:600 16px system-ui,sans-serif;text-align:center}#w img{width:84px;height:84px;display:block;margin:0 auto 12px}</style>
<script src="config.js"></script>
</head>
<body>
<div id="w"><div><img src="icon-192.png" alt="">লোড হচ্ছে…</div></div>
<script>
(function(){var u=window.IT_APP_URL;var w=document.getElementById('w');
if(!u){w.textContent='অ্যাপ এখনো চালু হয়নি';return}
if(!navigator.onLine){w.innerHTML='<div>📶 ইন্টারনেট নেই<br><small>সংযোগ পেলে নিজে থেকেই খুলবে</small></div>';addEventListener('online',function(){location.reload()});return}
var f=document.createElement('iframe');f.src=u+'';f.allow='clipboard-write';f.title='আল-ইত্তিহাদ ৫২';f.onload=function(){w.style.display='none'};document.body.appendChild(f);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
